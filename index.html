<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beaming — Diskusi Tanpa Batas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
            background: #fff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 2rem; max-width: 400px; }
        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #0093EC, #6BB99C, #FFCC00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        p { color: #75777A; font-size: 1rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Beaming</h1>
        <p>Ikuti percakapan secara real-time.</p>
        <p style="margin-top: 1rem; font-size: 0.85rem;">Scan kode QR dari app Beaming untuk bergabung ke diskusi.</p>
    </div>
</body>
</html>
